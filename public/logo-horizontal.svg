<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 135" width="620" height="135" role="img" aria-label="SangAI">
  <defs>
    <linearGradient id="sangai-ai-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6fe0"/>
      <stop offset="1" stop-color="#5b4bc4"/>
    </linearGradient>
    <linearGradient id="sangai-badge-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a4bb0"/>
      <stop offset="1" stop-color="#3d2f89"/>
    </linearGradient>
  </defs>

  <!-- Icon: the SangAI crown badge, same mark used across the stack's avatars -->
  <g>
    <rect x="0" y="7.5" width="120" height="120" rx="26" fill="url(#sangai-badge-grad)"/>
    <g transform="translate(23,30) scale(3.4)">
      <path d="M3 18 L3 9 L7.5 13 L12 6 L16.5 13 L21 9 L21 18 Z" fill="#fff"/>
      <rect x="3" y="19" width="18" height="2.4" rx="1.1" fill="#fff"/>
      <circle cx="3" cy="8" r="1.6" fill="#fff"/>
      <circle cx="12" cy="5" r="1.6" fill="#fff"/>
      <circle cx="21" cy="8" r="1.6" fill="#fff"/>
    </g>
  </g>

  <!-- Wordmark: "Sang" (neutral) + "AI" (accent gradient), same split grammar as
       the upstream OpenMAIC lockup (generic prefix + bright product suffix) -->
  <text x="150" y="100" font-family="'Noto Sans', sans-serif" font-weight="800" font-size="88" letter-spacing="-2">
    <tspan fill="#33415c">Sang</tspan><tspan fill="url(#sangai-ai-grad)">AI</tspan>
  </text>
</svg>
